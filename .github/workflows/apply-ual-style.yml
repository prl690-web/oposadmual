name: Apply UAL visual system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject UAL visual system
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '<!-- UAL-REDESIGN -->' not in s:
              needle = '</head>'
              injection = '\n  <!-- UAL-REDESIGN -->\n  <link rel="stylesheet" href="ual-redesign.css">\n'
              if needle not in s:
                  raise SystemExit('No se encontró </head>')
              s = s.replace(needle, injection + needle, 1)
              s = s.replace('📚 Oposición Auxiliar Administrativo — Universidad de Almería', 'Oposición Auxiliar Administrativo — Universidad de Almería')
              s = s.replace('📖 Estudiar', 'Estudiar').replace('📝 Hacer test', 'Hacer test').replace('📊 Progreso', 'Progreso')

          if '<!-- UAL-DASHBOARD -->' not in s:
              needle = '</body>'
              injection = '\n  <!-- UAL-DASHBOARD -->\n  <script src="ual-dashboard.js"></script>\n'
              if needle not in s:
                  raise SystemExit('No se encontró </body>')
              s = s.replace(needle, injection + needle, 1)

          if '<!-- UAL-STUDY -->' not in s:
              needle = '</head>'
              injection = '\n  <!-- UAL-STUDY -->\n  <link rel="stylesheet" href="study-redesign.css">\n'
              if needle not in s:
                  raise SystemExit('No se encontró </head>')
              s = s.replace(needle, injection + needle, 1)
              needle = '</body>'
              injection = '\n  <script src="study-redesign.js"></script>\n'
              if needle not in s:
                  raise SystemExit('No se encontró </body>')
              s = s.replace(needle, injection + needle, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ual-redesign.css ual-dashboard.js study-redesign.css study-redesign.js
          git diff --cached --quiet || git commit -m "feat: integrate redesigned study view"
          git push
